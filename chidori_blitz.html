<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>佐助·千鸟射击 Enhanced</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;user-select:none;touch-action:none;font-family:'Rajdhani',sans-serif;}
canvas{display:block;}

/* ─── Start Screen ─── */
#startScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:radial-gradient(ellipse at 50% 40%,#0a0a30 0%,#050510 70%,#000 100%);}
#startScreen h1{font-family:'Orbitron',monospace;font-size:clamp(24px,6vw,42px);font-weight:900;
background:linear-gradient(135deg,#00e5ff,#7c4dff,#ff1744);background-size:200% 200%;
animation:gradShift 3s ease infinite;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
margin-bottom:8px;letter-spacing:3px;text-align:center;}
@keyframes gradShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
#startScreen .subtitle{color:#8888aa;font-size:14px;margin-bottom:28px;letter-spacing:1px;}
.guide-box{background:rgba(255,255,255,0.04);border:1px solid rgba(0,229,255,0.15);border-radius:12px;
padding:18px 24px;margin:0 20px 32px;max-width:340px;text-align:left;}
.guide-row{display:flex;align-items:center;gap:10px;padding:6px 0;color:#bbb;font-size:14px;}
.guide-icon{width:28px;height:28px;background:rgba(0,229,255,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.guide-icon svg{width:16px;height:16px;}
#startBtn{width:200px;height:56px;font-family:'Orbitron',monospace;font-size:16px;font-weight:700;letter-spacing:2px;
border-radius:28px;border:2px solid rgba(0,229,255,0.5);background:linear-gradient(135deg,rgba(0,229,255,0.15),rgba(124,77,255,0.15));
color:#00e5ff;cursor:pointer;transition:all 0.3s;}
#startBtn:hover,#startBtn:active{background:linear-gradient(135deg,rgba(0,229,255,0.3),rgba(124,77,255,0.3));
box-shadow:0 0 30px rgba(0,229,255,0.3);transform:scale(1.05);}

/* ─── Game Over Screen ─── */
#gameOverScreen{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;
background:rgba(0,0,0,0.95);}
#gameOverScreen h2{font-family:'Orbitron',monospace;font-size:32px;color:#ff1744;margin-bottom:8px;letter-spacing:2px;}
.go-stats{display:flex;gap:24px;margin:16px 0 28px;font-size:18px;color:#bbb;}
.go-stats span{display:flex;flex-direction:column;align-items:center;gap:4px;}
.go-stats .val{font-family:'Orbitron',monospace;font-size:28px;font-weight:700;color:#fff;}
#restartBtn{width:200px;height:56px;font-family:'Orbitron',monospace;font-size:16px;font-weight:700;letter-spacing:2px;
border-radius:28px;border:2px solid rgba(0,229,255,0.5);background:linear-gradient(135deg,rgba(0,229,255,0.15),rgba(124,77,255,0.15));
color:#00e5ff;cursor:pointer;transition:all 0.3s;}
#restartBtn:hover,#restartBtn:active{background:linear-gradient(135deg,rgba(0,229,255,0.3),rgba(124,77,255,0.3));
box-shadow:0 0 30px rgba(0,229,255,0.3);transform:scale(1.05);}

/* ─── HUD ─── */
#hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;z-index:10;display:none;
pointer-events:none;font-family:'Rajdhani',sans-serif;}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;}
.hud-left,.hud-right{pointer-events:auto;}
.hud-score{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:#fff;text-shadow:0 0 10px rgba(0,229,255,0.5);}
.hud-wave{font-size:13px;color:#8888aa;letter-spacing:1px;margin-top:2px;}
.hud-combo{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#ffd740;
opacity:0;transition:opacity 0.3s;margin-top:4px;}
.hud-combo.active{opacity:1;}
.hp-bar{display:flex;gap:4px;align-items:center;}
.hp-heart{width:22px;height:22px;transition:transform 0.2s;}
.hp-heart.lost{opacity:0.2;transform:scale(0.8);}
.hp-heart.hit{animation:heartPop 0.3s ease;}
@keyframes heartPop{0%{transform:scale(1);}50%{transform:scale(1.4);}100%{transform:scale(1);}}
#pauseBtn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:11;
width:36px;height:36px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;
color:#888;font-size:16px;display:none;align-items:center;justify-content:center;cursor:pointer;}
#pauseBtn:active{background:rgba(255,255,255,0.12);}

/* ─── Wave Banner ─── */
#waveBanner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;
font-family:'Orbitron',monospace;font-size:clamp(28px,7vw,48px);font-weight:900;color:#fff;
text-shadow:0 0 40px rgba(0,229,255,0.6),0 0 80px rgba(124,77,255,0.3);
opacity:0;pointer-events:none;letter-spacing:4px;}
#waveSub{font-size:14px;color:#8888aa;text-align:center;margin-top:8px;letter-spacing:2px;font-weight:400;}

/* ─── Boss HP Bar ─── */
#bossBar{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:12;display:none;
width:min(300px,70vw);text-align:center;}
.boss-name{font-family:'Orbitron',monospace;font-size:12px;color:#b388ff;letter-spacing:2px;margin-bottom:4px;}
.boss-hp-track{width:100%;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;}
.boss-hp-fill{height:100%;background:linear-gradient(90deg,#7c4dff,#ff1744);border-radius:4px;transition:width 0.15s;width:100%;}

/* ─── Controls ─── */
#controls{position:fixed;bottom:0;left:0;right:0;z-index:10;display:none;padding:12px 16px 20px;
pointer-events:none;}
.ctrl-row{display:flex;justify-content:space-between;align-items:flex-end;}
.dpad{display:flex;gap:8px;pointer-events:auto;}
.dpad-btn{width:clamp(52px,14vw,68px);height:clamp(52px,14vw,68px);
background:rgba(0,229,255,0.08);border:1.5px solid rgba(0,229,255,0.2);border-radius:14px;
color:rgba(0,229,255,0.7);font-size:24px;display:flex;align-items:center;justify-content:center;
cursor:pointer;transition:all 0.15s;-webkit-tap-highlight-color:transparent;}
.dpad-btn:active,.dpad-btn.pressed{background:rgba(0,229,255,0.2);border-color:rgba(0,229,255,0.5);
box-shadow:0 0 15px rgba(0,229,255,0.2);color:#00e5ff;}
.skills{display:flex;flex-direction:column;gap:8px;pointer-events:auto;}
.skill-btn{width:clamp(52px,14vw,68px);height:clamp(52px,14vw,68px);border-radius:50%;
border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);
color:#fff;font-size:11px;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:0.5px;
cursor:pointer;position:relative;overflow:hidden;transition:all 0.2s;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:1px;-webkit-tap-highlight-color:transparent;}
.skill-btn .sk-icon{font-size:18px;line-height:1;}
.skill-btn .sk-label{font-size:10px;line-height:1;opacity:0.7;}
.skill-btn.ready{border-color:rgba(0,229,255,0.5);box-shadow:0 0 12px rgba(0,229,255,0.15);}
.skill-btn.ready:active{transform:scale(0.9);box-shadow:0 0 20px rgba(0,229,255,0.4);}
.skill-btn:not(.ready){opacity:0.4;}
.skill-cd{position:absolute;inset:0;background:conic-gradient(transparent var(--cd),rgba(0,0,0,0.6) var(--cd));
border-radius:50%;pointer-events:none;}
.skill-btn.ready .skill-cd{display:none;}
.s1-btn.ready{border-color:rgba(255,23,68,0.5);box-shadow:0 0 12px rgba(255,23,68,0.15);}
.s2-btn.ready{border-color:rgba(0,229,255,0.5);box-shadow:0 0 12px rgba(0,229,255,0.15);}
.s3-btn.ready{border-color:rgba(124,77,255,0.5);box-shadow:0 0 12px rgba(124,77,255,0.15);}

/* ─── Pause Overlay ─── */
#pauseOverlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.85);display:none;
flex-direction:column;align-items:center;justify-content:center;color:#fff;}
#pauseOverlay h2{font-family:'Orbitron',monospace;font-size:28px;letter-spacing:3px;margin-bottom:12px;}
#pauseOverlay p{color:#888;font-size:14px;}

/* ─── Power-up indicator ─── */
#activeBuffs{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:11;
display:flex;gap:8px;pointer-events:none;}
.buff-pill{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:1px;
background:rgba(0,0,0,0.6);border:1px solid;animation:buffIn 0.3s ease;}
@keyframes buffIn{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
</style>
</head>
<body>

<!-- Start Screen -->
<div id="startScreen">
  <h1>CHIDORI BLITZ</h1>
  <div class="subtitle">佐助·千鸟射击</div>
  <div class="guide-box">
    <div class="guide-row">
      <div class="guide-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
      <span>Arrow keys / D-pad to move</span>
    </div>
    <div class="guide-row">
      <div class="guide-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m10-10h-4M6 12H2"/></svg></div>
      <span>Auto-fire Chidori bolts</span>
    </div>
    <div class="guide-row">
      <div class="guide-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#ff1744" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <span>Skills: Amaterasu / Raikiri / Susano'o</span>
    </div>
    <div class="guide-row">
      <div class="guide-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd740" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
      <span>Collect power-ups & build combos!</span>
    </div>
  </div>
  <button id="startBtn">START</button>
</div>

<!-- Game Over Screen -->
<div id="gameOverScreen">
  <h2>GAME OVER</h2>
  <div class="go-stats">
    <span><div class="val" id="goScore">0</div>SCORE</span>
    <span><div class="val" id="goWave">0</div>WAVE</span>
    <span><div class="val" id="goCombo">0</div>BEST COMBO</span>
  </div>
  <button id="restartBtn">RETRY</button>
</div>

<!-- Pause -->
<div id="pauseOverlay">
  <h2>PAUSED</h2>
  <p>Tap anywhere to resume</p>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-top">
    <div class="hud-left">
      <div class="hud-score" id="scoreDisplay">0</div>
      <div class="hud-wave" id="waveDisplay">WAVE 1</div>
      <div class="hud-combo" id="comboDisplay">x2 COMBO</div>
    </div>
    <div class="hud-right">
      <div class="hp-bar" id="hpBar"></div>
    </div>
  </div>
</div>
<button id="pauseBtn">❚❚</button>

<!-- Wave Banner -->
<div id="waveBanner">WAVE 1<div id="waveSub">PREPARE YOURSELF</div></div>

<!-- Boss HP -->
<div id="bossBar">
  <div class="boss-name">SUSANO'O</div>
  <div class="boss-hp-track"><div class="boss-hp-fill" id="bossHpFill"></div></div>
</div>

<!-- Active Buffs -->
<div id="activeBuffs"></div>

<!-- Controls -->
<div id="controls">
  <div class="ctrl-row">
    <div class="dpad">
      <button class="dpad-btn" id="btnLeft">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="dpad-btn" id="btnRight">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="skills">
      <button class="skill-btn s1-btn ready" id="s1"><div class="skill-cd"></div><span class="sk-icon">炎</span><span class="sk-label">天照</span></button>
      <button class="skill-btn s2-btn ready" id="s2"><div class="skill-cd"></div><span class="sk-icon">雷</span><span class="sk-label">雷切</span></button>
      <button class="skill-btn s3-btn ready" id="s3"><div class="skill-cd"></div><span class="sk-icon">護</span><span class="sk-label">须佐</span></button>
    </div>
  </div>
</div>

<!-- Game Canvas -->
<canvas id="gameCanvas"></canvas>

<script>
// ═══════════════════════════════════════
// GAME ENGINE — requestAnimationFrame
// ═══════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── State ───
const G = {
  running: false, paused: false,
  score: 0, wave: 0, hp: 3, maxHp: 3,
  combo: 0, comboTimer: 0, maxCombo: 0, multiplier: 1,
  shieldActive: false, shieldTimer: 0,
  spreadShot: false, spreadTimer: 0,
  rapidFire: false, rapidTimer: 0,
  speedBoost: false, speedTimer: 0,
  shootTimer: 0, shootInterval: 0.1,
  waveTimer: 0, waveDelay: 3, waveEnemiesLeft: 0, waveBetween: false,
  shakeAmount: 0, shakeDecay: 0.9,
  bossActive: false, boss: null,
  skills: {
    s1: { ready: true, timer: 0, cooldown: 8 },
    s2: { ready: true, timer: 0, cooldown: 10 },
    s3: { ready: true, timer: 0, cooldown: 15 }
  },
  laserActive: false, laserTimer: 0
};

// Player
const player = { x: 0, y: 0, w: 50, h: 58, speed: 280, bobTime: 0 };

// Object pools
const bullets = [];
const enemies = [];
const particles = [];
const powerups = [];
const bossBullets = [];
const trails = [];

// Parallax stars (3 layers)
const starLayers = [[], [], []];
function initStars() {
  for (let layer = 0; layer < 3; layer++) {
    const count = [80, 50, 25][layer];
    for (let i = 0; i < count; i++) {
      starLayers[layer].push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: [0.5, 1, 1.8][layer],
        speed: [15, 35, 60][layer],
        alpha: [0.3, 0.5, 0.8][layer] + Math.random() * 0.2
      });
    }
  }
}

// ─── Wave config ───
function getWaveConfig(wave) {
  const base = 5 + wave * 3;
  const speed = Math.min(120 + wave * 15, 350);
  const types = wave < 3 ? ['normal'] : wave < 6 ? ['normal', 'fast'] : ['normal', 'fast', 'fast'];
  const boss = wave > 0 && wave % 4 === 0;
  return { count: base, speed, types, boss, spawnInterval: Math.max(0.8 - wave * 0.05, 0.3) };
}

let waveConf = null;
let spawnTimer = 0;
let lastTime = 0;

// ═══════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════

// ─── Draw Sasuke ───
function drawPlayer() {
  const px = player.x, py = player.y;
  const bob = Math.sin(player.bobTime * 3) * 2;
  ctx.save();
  ctx.translate(px + player.w/2, py + player.h/2 + bob);

  // Chakra aura
  const auraSize = 40 + Math.sin(player.bobTime * 5) * 5;
  const auraGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, auraSize);
  auraGrad.addColorStop(0, 'rgba(0,229,255,0.12)');
  auraGrad.addColorStop(0.5, 'rgba(124,77,255,0.06)');
  auraGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = auraGrad;
  ctx.fillRect(-auraSize, -auraSize, auraSize*2, auraSize*2);

  // Shield visual
  if (G.shieldActive) {
    ctx.strokeStyle = `rgba(124,77,255,${0.5 + Math.sin(player.bobTime * 8) * 0.3})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, 38, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(0,229,255,${0.3 + Math.sin(player.bobTime * 6) * 0.2})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 42, player.bobTime * 2, player.bobTime * 2 + Math.PI * 1.5);
    ctx.stroke();
  }

  // Body
  ctx.fillStyle = '#1a2a4a';
  ctx.beginPath();
  ctx.moveTo(0, -28);
  ctx.lineTo(22, -8);
  ctx.lineTo(18, 24);
  ctx.lineTo(0, 28);
  ctx.lineTo(-18, 24);
  ctx.lineTo(-22, -8);
  ctx.closePath();
  ctx.fill();

  // Inner detail
  ctx.fillStyle = '#0d1a30';
  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.lineTo(12, -5);
  ctx.lineTo(10, 18);
  ctx.lineTo(0, 22);
  ctx.lineTo(-10, 18);
  ctx.lineTo(-12, -5);
  ctx.closePath();
  ctx.fill();

  // Eyes - Sharingan (red) & Rinnegan (purple)
  ctx.fillStyle = '#ff1744';
  ctx.beginPath(); ctx.arc(-8, -8, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7c4dff';
  ctx.beginPath(); ctx.arc(8, -8, 4.5, 0, Math.PI*2); ctx.fill();
  // Pupils
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-8, -8, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -8, 2, 0, Math.PI*2); ctx.fill();
  // Tomoe on sharingan
  ctx.fillStyle = '#000';
  for (let i = 0; i < 3; i++) {
    const a = player.bobTime * 2 + i * (Math.PI*2/3);
    ctx.beginPath();
    ctx.arc(-8 + Math.cos(a)*2.5, -8 + Math.sin(a)*2.5, 0.8, 0, Math.PI*2);
    ctx.fill();
  }

  // Wings/flares
  ctx.fillStyle = 'rgba(0,229,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(-22, -5);
  ctx.lineTo(-32, 10);
  ctx.lineTo(-20, 15);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22, -5);
  ctx.lineTo(32, 10);
  ctx.lineTo(20, 15);
  ctx.closePath();
  ctx.fill();

  // Glow
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 15;
  ctx.strokeStyle = 'rgba(0,229,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -28);
  ctx.lineTo(22, -8);
  ctx.lineTo(18, 24);
  ctx.lineTo(0, 28);
  ctx.lineTo(-18, 24);
  ctx.lineTo(-22, -8);
  ctx.closePath();
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.restore();
}

// ─── Draw Bullet ───
function drawBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);

  // Trail glow
  const tGrad = ctx.createLinearGradient(0, 0, 0, 20);
  tGrad.addColorStop(0, 'rgba(0,229,255,0.8)');
  tGrad.addColorStop(1, 'rgba(0,229,255,0)');
  ctx.fillStyle = tGrad;
  ctx.fillRect(-2, 0, 4, 20);

  // Core
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(0, 0, 3, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Outer glow
  ctx.fillStyle = 'rgba(0,229,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 5, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ─── Draw Enemy ───
function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x + e.w/2, e.y + e.h/2);

  if (e.hitFlash > 0) {
    ctx.globalAlpha = 0.5 + Math.sin(e.hitFlash * 20) * 0.5;
  }

  if (e.type === 'normal') {
    // Red enemy
    ctx.fillStyle = '#ff1744';
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0, -e.h/2);
    ctx.lineTo(e.w/2, 0);
    ctx.lineTo(e.w/2-4, e.h/2);
    ctx.lineTo(-e.w/2+4, e.h/2);
    ctx.lineTo(-e.w/2, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#cc0033';
    ctx.beginPath();
    ctx.moveTo(0, -e.h/2+8);
    ctx.lineTo(e.w/4, 2);
    ctx.lineTo(0, e.h/2-4);
    ctx.lineTo(-e.w/4, 2);
    ctx.closePath();
    ctx.fill();
  } else if (e.type === 'fast') {
    // Gold diamond enemy
    ctx.fillStyle = '#ffd740';
    ctx.shadowColor = '#ffd740';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0, -e.h/2);
    ctx.lineTo(e.w/2, 0);
    ctx.lineTo(0, e.h/2);
    ctx.lineTo(-e.w/2, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f9a825';
    ctx.beginPath();
    ctx.moveTo(0, -e.h/2+6);
    ctx.lineTo(e.w/4, 0);
    ctx.lineTo(0, e.h/2-6);
    ctx.lineTo(-e.w/4, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─── Draw Boss ───
function drawBoss(b) {
  if (!b) return;
  ctx.save();
  ctx.translate(b.x + b.w/2, b.y + b.h/2);

  // Aura
  const auraR = 70 + Math.sin(b.time * 3) * 10;
  const aGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, auraR);
  aGrad.addColorStop(0, 'rgba(124,77,255,0.15)');
  aGrad.addColorStop(0.6, 'rgba(124,77,255,0.05)');
  aGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = aGrad;
  ctx.fillRect(-auraR, -auraR, auraR*2, auraR*2);

  if (b.hitFlash > 0) {
    ctx.globalAlpha = 0.5 + Math.sin(b.hitFlash * 20) * 0.5;
  }

  // Body
  ctx.fillStyle = '#7c4dff';
  ctx.shadowColor = '#7c4dff';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.moveTo(0, -b.h/2);
  ctx.lineTo(b.w/2, -b.h/4);
  ctx.lineTo(b.w/2-5, b.h/2-10);
  ctx.lineTo(-b.w/2+5, b.h/2-10);
  ctx.lineTo(-b.w/2, -b.h/4);
  ctx.closePath();
  ctx.fill();

  // Inner
  ctx.fillStyle = '#5e35b1';
  ctx.beginPath();
  ctx.moveTo(0, -b.h/2+12);
  ctx.lineTo(b.w/3, -b.h/6);
  ctx.lineTo(b.w/3-5, b.h/3);
  ctx.lineTo(-b.w/3+5, b.h/3);
  ctx.lineTo(-b.w/3, -b.h/6);
  ctx.closePath();
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#ff1744';
  ctx.beginPath(); ctx.arc(-18, -10, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath(); ctx.arc(18, -10, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-18, -10, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(18, -10, 4, 0, Math.PI*2); ctx.fill();

  // Horns
  ctx.fillStyle = '#9c27b0';
  ctx.beginPath();
  ctx.moveTo(-b.w/2+5, -b.h/4);
  ctx.lineTo(-b.w/2-15, -b.h/2-10);
  ctx.lineTo(-b.w/2+15, -b.h/4+5);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(b.w/2-5, -b.h/4);
  ctx.lineTo(b.w/2+15, -b.h/2-10);
  ctx.lineTo(b.w/2-15, -b.h/4+5);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ─── Draw Boss Bullet ───
function drawBossBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.shadowColor = '#ff1744';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ff1744';
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ─── Draw Particle ───
function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha = p.alpha;
  ctx.fillStyle = p.color;
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ─── Draw Power-up ───
function drawPowerup(p) {
  ctx.save();
  ctx.translate(p.x + 15, p.y + 15);
  const pulse = 1 + Math.sin(p.time * 5) * 0.1;
  ctx.scale(pulse, pulse);

  const colors = {
    spread: '#00e5ff', rapid: '#ffd740', speed: '#76ff03', heal: '#ff1744'
  };
  const col = colors[p.type] || '#fff';

  // Glow
  ctx.shadowColor = col;
  ctx.shadowBlur = 15;
  ctx.fillStyle = col;
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;

  // Diamond shape
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(12, 0);
  ctx.lineTo(0, 12);
  ctx.lineTo(-12, 0);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 0.3;
  ctx.stroke();

  // Icon letter
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.font = 'bold 12px Orbitron';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const icons = { spread: 'S', rapid: 'R', speed: 'V', heal: '+' };
  ctx.fillText(icons[p.type] || '?', 0, 1);

  ctx.shadowBlur = 0;
  ctx.restore();
}

// ─── Draw Laser (Raikiri skill) ───
function drawLaser() {
  if (!G.laserActive) return;
  const lx = player.x + player.w/2;
  ctx.save();

  // Wide glow
  const gGrad = ctx.createLinearGradient(lx-30, 0, lx+30, 0);
  gGrad.addColorStop(0, 'rgba(0,229,255,0)');
  gGrad.addColorStop(0.5, 'rgba(0,229,255,0.15)');
  gGrad.addColorStop(1, 'rgba(0,229,255,0)');
  ctx.fillStyle = gGrad;
  ctx.fillRect(lx-30, 0, 60, player.y);

  // Core beam
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 20;
  const bGrad = ctx.createLinearGradient(lx-6, 0, lx+6, 0);
  bGrad.addColorStop(0, 'rgba(0,229,255,0.4)');
  bGrad.addColorStop(0.3, 'rgba(255,255,255,0.9)');
  bGrad.addColorStop(0.7, 'rgba(255,255,255,0.9)');
  bGrad.addColorStop(1, 'rgba(0,229,255,0.4)');
  ctx.fillStyle = bGrad;
  ctx.fillRect(lx-6, 0, 12, player.y);

  // Flicker particles along beam
  for (let i = 0; i < 8; i++) {
    const py = Math.random() * player.y;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(lx + (Math.random()-0.5)*8, py, 1 + Math.random()*2, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}

// ═══════════════════════════════════════
// UPDATE LOGIC
// ═══════════════════════════════════════

function spawnParticles(x, y, color, count, speedMult = 1) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (30 + Math.random() * 120) * speedMult;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 1 + Math.random() * 3,
      alpha: 1,
      decay: 1.5 + Math.random() * 2,
      color
    });
  }
}

function spawnPowerup(x, y) {
  if (Math.random() > 0.2) return; // 20% drop chance
  const types = ['spread', 'rapid', 'speed', 'heal'];
  const weights = [0.3, 0.3, 0.2, 0.2];
  let r = Math.random(), cumul = 0, type = types[0];
  for (let i = 0; i < types.length; i++) {
    cumul += weights[i];
    if (r <= cumul) { type = types[i]; break; }
  }
  powerups.push({ x: x-15, y, w: 30, h: 30, type, vy: 60, time: 0 });
}

function activatePowerup(type) {
  const dur = 6;
  if (type === 'spread') { G.spreadShot = true; G.spreadTimer = dur; }
  else if (type === 'rapid') { G.rapidFire = true; G.rapidTimer = dur; G.shootInterval = 0.05; }
  else if (type === 'speed') { G.speedBoost = true; G.speedTimer = dur; }
  else if (type === 'heal') { G.hp = Math.min(G.hp + 1, G.maxHp); updateHpDisplay(); }
  updateBuffDisplay();
}

function addCombo() {
  G.combo++;
  G.comboTimer = 1.5;
  if (G.combo > G.maxCombo) G.maxCombo = G.combo;
  G.multiplier = G.combo >= 20 ? 8 : G.combo >= 10 ? 4 : G.combo >= 5 ? 2 : 1;
  const cd = document.getElementById('comboDisplay');
  cd.textContent = `x${G.multiplier} COMBO (${G.combo})`;
  cd.classList.add('active');
}

function resetCombo() {
  G.combo = 0; G.multiplier = 1; G.comboTimer = 0;
  document.getElementById('comboDisplay').classList.remove('active');
}

function addScore(base) {
  const pts = base * G.multiplier;
  G.score += pts;
  document.getElementById('scoreDisplay').textContent = G.score;
}

function takeDamage() {
  if (G.shieldActive) return;
  G.hp--;
  G.shakeAmount = 12;
  updateHpDisplay();
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff1744', 15);
  if (G.hp <= 0) gameOver();
}

function updateHpDisplay() {
  const bar = document.getElementById('hpBar');
  bar.innerHTML = '';
  for (let i = 0; i < G.maxHp; i++) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', `hp-heart ${i >= G.hp ? 'lost' : ''}`);
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', i < G.hp ? '#ff1744' : '#333');
    svg.innerHTML = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
    bar.appendChild(svg);
  }
}

function updateBuffDisplay() {
  const el = document.getElementById('activeBuffs');
  el.innerHTML = '';
  const buffs = [
    { active: G.spreadShot, label: 'SPREAD', color: '#00e5ff', timer: G.spreadTimer },
    { active: G.rapidFire, label: 'RAPID', color: '#ffd740', timer: G.rapidTimer },
    { active: G.speedBoost, label: 'SPEED', color: '#76ff03', timer: G.speedTimer },
    { active: G.shieldActive, label: 'SHIELD', color: '#7c4dff', timer: G.shieldTimer }
  ];
  buffs.filter(b => b.active).forEach(b => {
    const pill = document.createElement('div');
    pill.className = 'buff-pill';
    pill.style.borderColor = b.color;
    pill.style.color = b.color;
    pill.textContent = `${b.label} ${Math.ceil(b.timer)}s`;
    el.appendChild(pill);
  });
}

// ─── Wave management ───
function startWave() {
  G.wave++;
  waveConf = getWaveConfig(G.wave);
  G.waveEnemiesLeft = waveConf.count;
  G.waveBetween = false;
  spawnTimer = 0;
  document.getElementById('waveDisplay').textContent = `WAVE ${G.wave}`;
  showWaveBanner();
}

function showWaveBanner() {
  const banner = document.getElementById('waveBanner');
  const sub = document.getElementById('waveSub');
  banner.innerHTML = `WAVE ${G.wave}<div id="waveSub">${waveConf.boss ? 'BOSS INCOMING' : 'DESTROY ALL ENEMIES'}</div>`;
  banner.style.opacity = 1;
  banner.style.transition = 'none';
  setTimeout(() => {
    banner.style.transition = 'opacity 0.8s ease';
    banner.style.opacity = 0;
  }, 1800);
}

function spawnEnemy() {
  if (G.waveEnemiesLeft <= 0) return;
  G.waveEnemiesLeft--;

  const typePool = waveConf.types;
  const type = typePool[Math.floor(Math.random() * typePool.length)];
  const w = type === 'fast' ? 40 : 46;
  const h = type === 'fast' ? 48 : 56;
  const speed = waveConf.speed * (type === 'fast' ? 1.4 : 1);

  enemies.push({
    x: Math.random() * (W - w), y: -h,
    w, h, type, speed,
    hp: type === 'fast' ? 1 : 1 + Math.floor(G.wave / 5),
    hitFlash: 0
  });
}

function spawnBoss() {
  const bossHp = 20 + G.wave * 5;
  G.boss = {
    x: W/2 - 60, y: -130, w: 120, h: 120,
    hp: bossHp, maxHp: bossHp,
    speed: 60, targetY: 60,
    moveDir: 1, moveSpeed: 80,
    shootTimer: 0, shootInterval: 0.8,
    phase: 1, time: 0, hitFlash: 0
  };
  G.bossActive = true;
  document.getElementById('bossBar').style.display = 'block';
}

// ─── Main update ───
function update(dt) {
  player.bobTime += dt;

  // Player movement
  const speed = player.speed * (G.speedBoost ? 1.6 : 1);
  if (inputState.left) player.x -= speed * dt;
  if (inputState.right) player.x += speed * dt;
  if (inputState.up) player.y -= speed * dt;
  if (inputState.down) player.y += speed * dt;
  player.x = Math.max(0, Math.min(W - player.w, player.x));
  player.y = Math.max(50, Math.min(H - player.h - 30, player.y));

  // Auto shoot
  const interval = G.rapidFire ? 0.05 : 0.1;
  G.shootTimer += dt;
  if (G.shootTimer >= interval) {
    G.shootTimer = 0;
    fireBullet();
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= 700 * dt;
    if (b.y < -20) bullets.splice(i, 1);
  }

  // Update enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed * dt;
    if (e.hitFlash > 0) e.hitFlash -= dt * 4;
    if (e.y > H + 20) { enemies.splice(i, 1); resetCombo(); continue; }

    // Collision with player
    if (rectsOverlap(player, e)) {
      takeDamage();
      spawnParticles(e.x + e.w/2, e.y + e.h/2, e.type === 'fast' ? '#ffd740' : '#ff1744', 12);
      enemies.splice(i, 1);
      continue;
    }

    // Bullet collision
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
        e.hp--;
        e.hitFlash = 1;
        bullets.splice(j, 1);
        if (e.hp <= 0) {
          const col = e.type === 'fast' ? '#ffd740' : '#ff1744';
          spawnParticles(e.x + e.w/2, e.y + e.h/2, col, 20);
          addScore(e.type === 'fast' ? 3 : 1);
          addCombo();
          spawnPowerup(e.x + e.w/2, e.y + e.h/2);
          enemies.splice(i, 1);
        }
        break;
      }
    }
  }

  // Laser collision (Raikiri)
  if (G.laserActive) {
    G.laserTimer -= dt;
    if (G.laserTimer <= 0) { G.laserActive = false; }
    const lx = player.x + player.w/2;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (lx > e.x - 6 && lx < e.x + e.w + 6) {
        spawnParticles(e.x + e.w/2, e.y + e.h/2, '#00e5ff', 10);
        addScore(e.type === 'fast' ? 3 : 1);
        addCombo();
        enemies.splice(i, 1);
      }
    }
    // Laser vs boss
    if (G.bossActive && G.boss) {
      const b = G.boss;
      if (lx > b.x && lx < b.x + b.w) {
        b.hp -= 60 * dt; // DPS
        b.hitFlash = 0.5;
      }
    }
  }

  // Update boss
  if (G.bossActive && G.boss) {
    const b = G.boss;
    b.time += dt;
    if (b.hitFlash > 0) b.hitFlash -= dt * 4;

    // Move to target Y
    if (b.y < b.targetY) b.y += b.speed * dt;

    // Side movement
    b.x += b.moveDir * b.moveSpeed * dt;
    if (b.x < 10) b.moveDir = 1;
    if (b.x > W - b.w - 10) b.moveDir = -1;

    // Shoot
    b.shootTimer += dt;
    const si = b.hp < b.maxHp * 0.4 ? 0.4 : b.shootInterval;
    if (b.shootTimer >= si && b.y >= b.targetY) {
      b.shootTimer = 0;
      // Phase 2: spread shot
      if (b.hp < b.maxHp * 0.5) {
        for (let a = -1; a <= 1; a++) {
          bossBullets.push({
            x: b.x + b.w/2, y: b.y + b.h,
            vx: a * 80, vy: 200
          });
        }
      } else {
        bossBullets.push({
          x: b.x + b.w/2, y: b.y + b.h,
          vx: 0, vy: 250
        });
      }
    }

    // Bullet collision
    for (let j = bullets.length - 1; j >= 0; j--) {
      const bl = bullets[j];
      if (bl.x > b.x && bl.x < b.x + b.w && bl.y > b.y && bl.y < b.y + b.h) {
        b.hp--;
        b.hitFlash = 0.3;
        bullets.splice(j, 1);
        spawnParticles(bl.x, bl.y, '#7c4dff', 4);
      }
    }

    // Update HP bar
    const pct = Math.max(0, b.hp / b.maxHp) * 100;
    document.getElementById('bossHpFill').style.width = pct + '%';

    // Boss death
    if (b.hp <= 0) {
      spawnParticles(b.x + b.w/2, b.y + b.h/2, '#7c4dff', 50, 1.5);
      spawnParticles(b.x + b.w/2, b.y + b.h/2, '#ff1744', 30, 1.2);
      spawnParticles(b.x + b.w/2, b.y + b.h/2, '#fff', 20);
      addScore(100);
      G.shakeAmount = 20;
      G.bossActive = false;
      G.boss = null;
      document.getElementById('bossBar').style.display = 'none';
      // Clear boss bullets
      bossBullets.length = 0;
    }

    // Boss collision with player
    if (rectsOverlap(player, b)) {
      takeDamage();
    }
  }

  // Update boss bullets
  for (let i = bossBullets.length - 1; i >= 0; i--) {
    const b = bossBullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y > H + 10 || b.x < -10 || b.x > W + 10) { bossBullets.splice(i, 1); continue; }

    // Hit player
    if (Math.abs(b.x - (player.x + player.w/2)) < 20 && Math.abs(b.y - (player.y + player.h/2)) < 20) {
      takeDamage();
      bossBullets.splice(i, 1);
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.alpha -= p.decay * dt;
    p.size *= 0.98;
    if (p.alpha <= 0) particles.splice(i, 1);
  }

  // Update powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy * dt;
    p.time += dt;
    if (p.y > H + 30) { powerups.splice(i, 1); continue; }

    // Collect
    if (rectsOverlap(player, p)) {
      activatePowerup(p.type);
      spawnParticles(p.x + p.w/2, p.y + p.h/2, '#fff', 10);
      powerups.splice(i, 1);
    }
  }

  // Update buff timers
  if (G.spreadShot) { G.spreadTimer -= dt; if (G.spreadTimer <= 0) { G.spreadShot = false; updateBuffDisplay(); } }
  if (G.rapidFire) { G.rapidTimer -= dt; if (G.rapidTimer <= 0) { G.rapidFire = false; G.shootInterval = 0.1; updateBuffDisplay(); } }
  if (G.speedBoost) { G.speedTimer -= dt; if (G.speedTimer <= 0) { G.speedBoost = false; updateBuffDisplay(); } }
  if (G.shieldActive) { G.shieldTimer -= dt; if (G.shieldTimer <= 0) { G.shieldActive = false; updateBuffDisplay(); } }

  // Combo timer
  if (G.combo > 0) {
    G.comboTimer -= dt;
    if (G.comboTimer <= 0) resetCombo();
  }

  // Update stars
  for (let layer = 0; layer < 3; layer++) {
    starLayers[layer].forEach(s => {
      s.y += s.speed * dt;
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    });
  }

  // Screen shake decay
  if (G.shakeAmount > 0) G.shakeAmount *= Math.pow(G.shakeDecay, dt * 60);
  if (G.shakeAmount < 0.1) G.shakeAmount = 0;

  // Skill cooldowns
  for (const key in G.skills) {
    const sk = G.skills[key];
    if (!sk.ready) {
      sk.timer -= dt;
      if (sk.timer <= 0) {
        sk.ready = true;
        document.getElementById(key).classList.add('ready');
      }
      // Update cooldown visual
      const pct = (sk.timer / sk.cooldown) * 100;
      document.getElementById(key).querySelector('.skill-cd').style.setProperty('--cd', (100-pct)+'%');
    }
  }

  // Wave spawning
  if (!G.waveBetween && G.waveEnemiesLeft > 0 && !G.bossActive) {
    spawnTimer += dt;
    if (spawnTimer >= waveConf.spawnInterval) {
      spawnTimer = 0;
      spawnEnemy();
    }
  }

  // Check wave complete
  if (!G.waveBetween && G.waveEnemiesLeft <= 0 && enemies.length === 0 && !G.bossActive) {
    if (waveConf && waveConf.boss && !G.bossActive && !G.boss) {
      spawnBoss();
    } else if (!waveConf || !waveConf.boss || (waveConf.boss && !G.bossActive)) {
      G.waveBetween = true;
      G.waveTimer = 2.5;
    }
  }
  if (G.waveBetween) {
    G.waveTimer -= dt;
    if (G.waveTimer <= 0) startWave();
  }
}

function fireBullet() {
  const bx = player.x + player.w/2;
  const by = player.y;
  bullets.push({ x: bx, y: by });
  if (G.spreadShot) {
    bullets.push({ x: bx - 15, y: by + 5, angle: -0.15 });
    bullets.push({ x: bx + 15, y: by + 5, angle: 0.15 });
  }
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ─── Main render ───
function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();

  // Screen shake
  if (G.shakeAmount > 0) {
    const sx = (Math.random() - 0.5) * G.shakeAmount;
    const sy = (Math.random() - 0.5) * G.shakeAmount;
    ctx.translate(sx, sy);
  }

  // Background
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  // Nebula
  const nGrad = ctx.createRadialGradient(W*0.3, H*0.4, 50, W*0.3, H*0.4, H*0.6);
  nGrad.addColorStop(0, 'rgba(124,77,255,0.04)');
  nGrad.addColorStop(0.5, 'rgba(0,229,255,0.02)');
  nGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = nGrad;
  ctx.fillRect(0, 0, W, H);
  const n2Grad = ctx.createRadialGradient(W*0.7, H*0.6, 30, W*0.7, H*0.6, H*0.4);
  n2Grad.addColorStop(0, 'rgba(255,23,68,0.03)');
  n2Grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = n2Grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (let layer = 0; layer < 3; layer++) {
    starLayers[layer].forEach(s => {
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      ctx.fill();
    });
  }
  ctx.globalAlpha = 1;

  // Laser
  drawLaser();

  // Power-ups
  powerups.forEach(drawPowerup);

  // Enemies
  enemies.forEach(drawEnemy);

  // Boss
  if (G.bossActive) drawBoss(G.boss);

  // Bullets
  bullets.forEach(drawBullet);

  // Boss bullets
  bossBullets.forEach(drawBossBullet);

  // Player
  drawPlayer();

  // Particles (on top)
  particles.forEach(drawParticle);

  ctx.restore();
}

// ─── Spread bullet movement fix ───
const origUpdate = update;

// Override bullet update for spread
function updateBullets_spread(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.angle) {
      b.x += Math.sin(b.angle) * 700 * dt;
    }
    b.y -= 700 * dt;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
  }
}

// ═══════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // cap delta
  lastTime = timestamp;

  if (G.running && !G.paused) {
    // Override bullet update
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.angle) b.x += Math.sin(b.angle) * 700 * dt;
    }
    update(dt);
    render();
  }
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════
// INPUT
// ═══════════════════════════════════════
const inputState = { left: false, right: false, up: false, down: false };

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') inputState.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') inputState.right = true;
  if (e.key === 'ArrowUp' || e.key === 'w') inputState.up = true;
  if (e.key === 'ArrowDown' || e.key === 's') inputState.down = true;
  if (e.key === '1') useSkill('s1');
  if (e.key === '2') useSkill('s2');
  if (e.key === '3') useSkill('s3');
  if (e.key === 'Escape' || e.key === 'p') togglePause();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') inputState.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') inputState.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w') inputState.up = false;
  if (e.key === 'ArrowDown' || e.key === 's') inputState.down = false;
});

// Touch D-pad
function setupTouch(id, dir) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', e => { e.preventDefault(); inputState[dir] = true; btn.classList.add('pressed'); });
  btn.addEventListener('touchend', e => { e.preventDefault(); inputState[dir] = false; btn.classList.remove('pressed'); });
  btn.addEventListener('touchcancel', e => { inputState[dir] = false; btn.classList.remove('pressed'); });
  btn.addEventListener('mousedown', () => { inputState[dir] = true; btn.classList.add('pressed'); });
  btn.addEventListener('mouseup', () => { inputState[dir] = false; btn.classList.remove('pressed'); });
}
setupTouch('btnLeft', 'left');
setupTouch('btnRight', 'right');

// Skills
document.getElementById('s1').addEventListener('click', () => useSkill('s1'));
document.getElementById('s2').addEventListener('click', () => useSkill('s2'));
document.getElementById('s3').addEventListener('click', () => useSkill('s3'));

function useSkill(id) {
  if (!G.running || G.paused) return;
  const sk = G.skills[id];
  if (!sk.ready) return;
  sk.ready = false;
  sk.timer = sk.cooldown;
  document.getElementById(id).classList.remove('ready');

  if (id === 's1') {
    // Amaterasu — screen nuke
    G.shakeAmount = 15;
    spawnParticles(W/2, H/2, '#ff1744', 60, 2);
    spawnParticles(W/2, H/2, '#ff6d00', 40, 1.5);
    enemies.forEach(e => {
      spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ff1744', 8);
      addScore(5);
      addCombo();
    });
    enemies.length = 0;
    if (G.bossActive && G.boss) {
      G.boss.hp -= 15;
      G.boss.hitFlash = 1;
    }
  } else if (id === 's2') {
    // Raikiri — vertical laser
    G.laserActive = true;
    G.laserTimer = 3;
  } else if (id === 's3') {
    // Susano'o Shield
    G.shieldActive = true;
    G.shieldTimer = 6;
    updateBuffDisplay();
  }
}

// Pause
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('pauseOverlay').addEventListener('click', togglePause);

function togglePause() {
  if (!G.running) return;
  G.paused = !G.paused;
  document.getElementById('pauseOverlay').style.display = G.paused ? 'flex' : 'none';
}

// ═══════════════════════════════════════
// GAME FLOW
// ═══════════════════════════════════════

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('controls').style.display = 'block';
  document.getElementById('pauseBtn').style.display = 'flex';

  // Reset state
  G.score = 0; G.wave = 0; G.hp = 3; G.maxHp = 3;
  G.combo = 0; G.comboTimer = 0; G.maxCombo = 0; G.multiplier = 1;
  G.shieldActive = false; G.spreadShot = false; G.rapidFire = false; G.speedBoost = false;
  G.bossActive = false; G.boss = null; G.laserActive = false;
  G.shakeAmount = 0;
  for (const k in G.skills) { G.skills[k].ready = true; G.skills[k].timer = 0; document.getElementById(k).classList.add('ready'); }

  bullets.length = 0; enemies.length = 0; particles.length = 0;
  powerups.length = 0; bossBullets.length = 0;

  player.x = W/2 - player.w/2;
  player.y = H - 140;

  document.getElementById('scoreDisplay').textContent = '0';
  updateHpDisplay();
  updateBuffDisplay();
  document.getElementById('bossBar').style.display = 'none';

  G.running = true;
  G.paused = false;
  G.waveBetween = true;
  G.waveTimer = 1;
  lastTime = 0;
}

function gameOver() {
  G.running = false;
  document.getElementById('hud').style.display = 'none';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('goScore').textContent = G.score;
  document.getElementById('goWave').textContent = G.wave;
  document.getElementById('goCombo').textContent = G.maxCombo;
  document.getElementById('gameOverScreen').style.display = 'flex';
}

// ─── Init ───
initStars();
requestAnimationFrame(gameLoop);

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('gameOverScreen').style.display = 'none';
  startGame();
});
</script>
